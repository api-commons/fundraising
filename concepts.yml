context: fundraising
name: Nonprofit Fundraising
intro: >-
  The common fundraising vocabulary -- the donors and constituents who give, the donations and
  gifts they make, the pledges and recurring gifts they commit to, the campaigns that ask and the
  funds the money is designated to -- distilled from the APIs that already exist.
tags: [Non-Profit, Nonprofit, Fundraising, Donations, Philanthropy, Charity, Donor Management, Giving]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, external_id, constituent_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, date_added]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified, date_modified_ts]
  metadata: [meta_data, custom_fields, custom, attributes, properties, tags]
  status: [state, gift_status, donation_status]
  name: [title, display_name, label, full_name]
  donor_id: [donor, constituent, supporter_id, supporter, contact_id, person_id, account_id]
  amount: [value, gift_amount, donation_amount, total, total_amount, amount_cents]
  currency: [currency_code]
  campaign_id: [campaign, appeal_id, appeal, page_id, fundraiser_id]
  fund_id: [fund, designation_id, designation, fund_ids]

concepts:
  donor:
    segments: [donors, donor, constituents, constituent, supporters, supporter, contacts@donors|fundraising|crm, members@donors]
    aliases:
      first_name: [firstname, given_name, first]
      last_name: [lastname, surname, family_name, last]
      email: [email_address, emails, primary_email]
      phone: [phone_number, phones]
      address: [addresses, primary_address]
      lifetime_giving: [total_given, lifetime_value, total_donated, giving_total]
  donation:
    segments: [donations, donation, gifts, gift, contributions, contribution, transactions@donations|giving|fundraising]
    aliases:
      date: [donated_at, gift_date, donation_date, received_at, date_received]
      type: [gift_type, donation_type, payment_type, kind]
      recurring: [is_recurring, recurring_donation_id, recurring_gift_id]
      anonymous: [is_anonymous]
      payment_method: [payment_type, method, tender]
  # pledge was measured and dropped: 1 provider exposes recurring gifts as a resource.
  fundraising_campaign:
    requires: [donor]
    path: /fundraising-campaigns
    segments: [campaigns, campaign, appeals, appeal, fundraisers, fundraiser, pages@fundraising|peer, forms@donation|giving]
    aliases:
      goal: [goal_amount, target, target_amount, fundraising_goal]
      raised: [amount_raised, total_raised, raised_amount]
      start_date: [starts_at, start]
      end_date: [ends_at, end]
  fund:
    requires: [donor]
    segments: [funds, fund, designations, designation]
    aliases:
      code: [fund_code, lookup_id, designation_code]

findings:
  - "Fundraising publishes little (50 providers, 14 mapped), but what is published agrees almost
    completely: a donation on amount, type, donor and date; a campaign on name, goal, currency,
    start and end; a donor on name, email, phone and address; a fund on name, description and
    the campaign it belongs to."
  - "Nonprofit software converged on one model of giving -- the donor, the gift, the appeal and the
    fund -- and the published APIs carry it with little drift."
decisions:
  - "Constituents and supporters are donors; gifts and contributions are donations; designations
    are funds."
  - "Campaigns are `/fundraising-campaigns`: email marketing and advertising own `/campaigns`."
  - "Donations need no donor resource in the same API: gift-processing platforms expose gifts
    alone."
  - "Pledges were measured and dropped."

workflows:
  - id: record-a-gift
    summary: Add a donor and record a donation to a campaign
    steps:
      - {op: getFundraisingCampaign, id: campaign, path: {"{fundraising_campaign_id}": "$inputs.campaign_id"}}
      - {op: createDonor, id: donor}
      - {op: createDonation, id: donation, link: {donor_id: "$steps.donor.outputs.id", campaign_id: "$steps.campaign.outputs.id"}}
